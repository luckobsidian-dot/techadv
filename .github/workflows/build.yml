
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Godot
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"

          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"

          cp -a /root/.config/godot/. "$HOME/.config/godot/"

          test -f /root/debug.keystore

          echo "Godot setup complete!"
          godot --version

      - name: Check project
        run: |
          test -f project.godot
          test -f export_presets.cfg
          echo "Project files found!"

      - name: Import project
        run: |
          godot --headless --path . --import

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --verbose --export-debug "Android" build/techadv.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: techadv-apk
          path: build/techadv.apk
          if-no-files-found: error
